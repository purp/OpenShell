# Rung E: policy-l7.yaml + request_body_credential_rewrite — the proxy
# buffers UTF-8 request bodies (<=256 KiB) and scans/rewrites placeholders.
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /home/sandbox

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  bench_echo:
    name: bench_echo
    endpoints:
      - host: host.docker.internal
        port: 8443
        protocol: rest
        tls: terminate
        enforcement: enforce
        request_body_credential_rewrite: true
        allowed_ips:
          - "192.168.65.0/24"
          - "fdc4:f303:9324::/64"
        rules:
          - allow:
              method: GET
              path: "/bytes/*"
          - allow:
              method: GET
              path: "/ok*"
          - allow:
              method: POST
              path: "/sink"
    binaries:
      - { path: /usr/bin/curl }
